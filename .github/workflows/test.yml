name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run unit and architecture tests
        run: |
          dotnet test tests/VariableCompensation.Application.Tests/VariableCompensation.Application.Tests.csproj --configuration Release --collect:"XPlat Code Coverage"
          dotnet test tests/VariableCompensation.Architecture.Tests/VariableCompensation.Architecture.Tests.csproj --configuration Release
          dotnet test tests/VariableCompensation.Domain.Tests/VariableCompensation.Domain.Tests.csproj --configuration Release

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run integration tests
        run: dotnet test tests/VariableCompensation.Integration.Tests/VariableCompensation.Integration.Tests.csproj --configuration Release

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
